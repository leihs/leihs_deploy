- name: check cluster locale provider
  become: yes
  become_user: postgres
  shell: psql -p 5415 -XAtc "SELECT datlocprovider FROM pg_database WHERE datname = 'template0';"
  register: pg_locale_provider
  changed_when: false

# A glibc or ICU upgrade (e.g. bookworm → trixie) changes the sort order of the
# collation the databases were created with. Indexes on text columns then have
# to be rebuilt before the new version is recorded.
- name: list databases whose collation version differs from the OS
  become: yes
  become_user: postgres
  shell: |
    cd /tmp
    psql -p 5415 -XAtc "SELECT datname FROM pg_database WHERE datallowconn AND NOT datistemplate AND datcollversion IS DISTINCT FROM pg_database_collation_actual_version(oid);"
  register: pg_collation_mismatch
  changed_when: false

- name: reindex and refresh collation version of the listed databases
  become: yes
  become_user: postgres
  loop: "{{ pg_collation_mismatch.stdout_lines }}"
  shell: |
    set -e
    cd /tmp
    psql -p 5415 -d '{{ item }}' -X -v ON_ERROR_STOP=1 \
      -c 'REINDEX DATABASE "{{ item }}";' \
      -c 'ALTER DATABASE "{{ item }}" REFRESH COLLATION VERSION;'

- name: Refresh collation versions after glibc upgrade
  become: yes
  become_user: postgres
  when: pg_locale_provider.stdout == 'c'
  shell: |
    set -e
    cd /tmp
    psql -p 5415 -c "ALTER DATABASE postgres REFRESH COLLATION VERSION;"
    psql -p 5415 -d template1 -c "
      DO \$\$
      DECLARE r RECORD;
      BEGIN
        FOR r IN SELECT collname FROM pg_collation WHERE collversion IS NOT NULL
        LOOP
          BEGIN
            EXECUTE format('ALTER COLLATION %I REFRESH VERSION', r.collname);
          EXCEPTION WHEN OTHERS THEN
            RAISE NOTICE 'skipping %: %', r.collname, SQLERRM;
          END;
        END LOOP;
      END \$\$;
    "
    psql -p 5415 -c "ALTER DATABASE template1 REFRESH COLLATION VERSION;"
    psql -p 5415 -c "UPDATE pg_database SET datcollversion = NULL WHERE datname = 'template0';"
  changed_when: true
