environment_variables:
  CONTAINER_NAME: leihs-deploy-test-{{CIDER_CI_TRIAL_ID}}
  # jar build cache of shared-clj/bin/helpers/build.sh, the same as for the
  # integration tests: we are testing the deploy and not the build here
  BUILDCACHE_TMPDIR: /tmp/leihs-buildcache

git_options:
  submodules:
    include_match: ^.*$

scripts:
  test:
    start_when:
      upgraded to trixie:
        script_key: upgrade-container

include:
  - container-test/cider-ci/task-components/install-dependencies.yml
  - container-test/cider-ci/task-components/container.yml
  - container-test/cider-ci/task-components/deploy-to-container.yml
  - container-test/cider-ci/task-components/upgrade-bookworm-to-trixie.yml
  - container-test/cider-ci/task-components/test-container.yml
